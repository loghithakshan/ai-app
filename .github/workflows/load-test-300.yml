name: 300 Test Case Web Load & Performance Testing Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  load-test-300:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment (Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Install Dependencies
        run: |
          npm install --legacy-peer-deps --no-package-lock

      - name: 4. Build Next.js Production Application
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
        run: |
          npx next build

      - name: 5. Start Next.js Web Application
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
        run: |
          npx next start -H 127.0.0.1 -p 3000 &
          npx wait-on http://127.0.0.1:3000 -t 60000 || echo "Web server ready"

      - name: 6. Execute 300 Load Test Cases & Performance Benchmarks
        env:
          BASE_URL: 'http://127.0.0.1:3000'
        run: |
          node selenium-tests/tests/load-test-300.js

      - name: 7. Upload 300 Load Test Excel Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Web-Load-Testing-300-Excel-Reports
          path: |
            selenium-tests/*.xlsx
            selenium-tests/reports/*.xlsx
